[package]
name = "runvault"
version = "0.1.0"
edition = "2024"

[dependencies]
age = { version = "0.11.1", features = ["armor"] }
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1.8.2"
